# =============================================================================
# Nginx Configuration: Doctor Pyme (www.doctorpyme.co)
# Servidor Principal + Subcarpeta /sst para Aplicativo SG-SST
# =============================================================================

# Redirección forzosa de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name doctorpyme.co www.doctorpyme.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor Seguro HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doctorpyme.co www.doctorpyme.co;

    # Certificados SSL gestionados por Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/doctorpyme.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doctorpyme.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Optimización y compresión Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Seguridad HTTP Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # -------------------------------------------------------------------------
    # 1. RAÍZ: Página Web Comercial / Institucional Doctor Pyme (Landing Page)
    # -------------------------------------------------------------------------
    location / {
        root /var/www/doctorpyme/landing;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # 2. APLICATIVO SG-SST: www.doctorpyme.co/sst
    # -------------------------------------------------------------------------
    location /sst {
        alias /var/www/doctorpyme/sst;
        index index.html;
        try_files $uri $uri/ /sst/index.html;
    }

    # Proxy para la API de persistencia en disco del SG-SST
    location /sst/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Fallback por si la API se invoca directamente en /api/
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para activos estáticos del aplicativo (imágenes, fuentes, css)
    location ~* /sst/.*\.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2|webmanifest)$ {
        alias /var/www/doctorpyme/sst;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    client_max_body_size 25M;
}
