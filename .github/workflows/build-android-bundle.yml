name: Generar Android App Bundle (.aab) Doctor Pyme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-bundle.yml'

jobs:
  build-aab:
    name: Compilar y Firmar AAB (TWA Oficial Google)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Aceptar Licencias e Instalar Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: false

      - name: 🤖 Compilar y Firmar AAB
        run: |
          cd android
          gradle bundleRelease --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/doctorpyme-v1.0.3.aab

      - name: 📤 Publicar Artefacto .AAB para Google Play Console
        uses: actions/upload-artifact@v4
        with:
          name: DoctorPyme-v1.0.3-AAB
          path: |
            android/app/build/outputs/bundle/release/doctorpyme-v1.0.3.aab
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
