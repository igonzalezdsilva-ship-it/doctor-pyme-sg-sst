name: Generar Android App Bundle (.aab) Doctor Pyme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.well-known/**'
      - 'manifest.json'

jobs:
  build-aab:
    name: Compilar y Firmar AAB (TWA Bubblewrap)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Instalar Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: 🛠️ Generar y Compilar Proyecto Android TWA
        env:
          KEYSTORE_PASSWORD: "DoctorPyme2026*"
          KEY_PASSWORD: "DoctorPyme2026*"
        run: |
          cd android
          # Crear configuración Bubblewrap si no existe
          bubblewrap build --skipPwaValidation || true

      - name: 📤 Publicar Artefacto .AAB para Google Play Console
        uses: actions/upload-artifact@v4
        with:
          name: DoctorPyme-Release-AAB
          path: |
            android/*.aab
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
