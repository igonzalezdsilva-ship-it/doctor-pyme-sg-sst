name: Generar Android App Bundle (.aab) Doctor Pyme

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android-bundle.yml'

jobs:
  build-aab:
    name: Compilar y Firmar AAB (TWA Oficial Google)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: false

      - name: 🤖 Compilar y Firmar AAB
        run: |
          cd android
          gradle bundleRelease --stacktrace

      - name: 📤 Publicar Artefacto .AAB para Google Play Console
        uses: actions/upload-artifact@v4
        with:
          name: DoctorPyme-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
