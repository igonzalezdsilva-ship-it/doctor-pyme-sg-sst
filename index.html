<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doctor Pyme | Plataforma SG-SST Colombia (Decreto 1072 & Res. 0312)</title>
  
  <!-- Favicon y Soporte PWA (Instalable en Móvil y Escritorio) -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/app-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="alternate" type="application/manifest+json" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0d9488">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Doctor Pyme">

  <!-- Motor de Exportación y Descarga de PDF Directo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Fuentes: Plus Jakarta Sans (interfaz) y JetBrains Mono (NIT, cédulas, códigos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <!-- Tailwind CSS CDN enlazado a tokens semánticos (css/tokens.css) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: 'var(--card)',
            muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
            border: 'var(--border)',
            primary: { DEFAULT: 'var(--primary)', hover: 'var(--primary-hover)', foreground: 'var(--primary-foreground)', soft: 'var(--primary-soft)' },
            ring: 'var(--ring)',
            brand: {
              navy: '#0b1a2d', 'navy-dark': '#060d17', teal: '#0f766e', 'teal-light': '#14b8a6',
              emerald: '#10b981', 'emerald-light': '#34d399', cyan: '#06b6d4'
            },
            /* Alias de migración: el antiguo primario indigo ahora resuelve al primario teal.
               Retirar cuando las vistas pasen a tokens semánticos (Fase 3). */
            indigo: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf',
              500: '#14b8a6', 600: '#0f766e', 700: '#115e59', 800: '#134e4a', 900: '#134e4a', 950: '#042f2e'
            }
          }
        }
      }
    };
  </script>

  <!-- Tokens, shell y estilos de vistas -->
  <link rel="stylesheet" href="./css/tokens.css?v=1.0">
  <link rel="stylesheet" href="./css/styles.css?v=2.6">
  <link rel="stylesheet" href="./css/shell.css?v=1.0">
</head>
<body class="h-full">

  <!-- CONTENEDOR RAÍZ (Controlado por Auth / App) -->
  <div id="app-root" class="h-full flex overflow-hidden">

    <!-- SIDEBAR: w-64 colapsable a w-16 en escritorio; drawer bajo 768px -->
    <aside id="app-sidebar" class="shell-sidebar no-print" aria-label="Navegación principal">
      <div id="sidebar-header" class="sidebar-header">
        <div id="sidebar-logo-container" class="sidebar-logo-container" title="Doctor Pyme">
          <img id="sidebar-logo-img" src="./assets/app-icon.png" alt="" class="sidebar-logo-img">
          <span class="sidebar-brand sidebar-text">Doctor Pyme<small>Salud y seguridad en el trabajo</small></span>
        </div>
        <button id="btn-toggle-sidebar" class="icon-btn btn-toggle-sidebar" type="button" aria-label="Contraer menú" title="Contraer / expandir menú">
          <svg id="sidebar-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
        </button>
      </div>

      <!-- Tenant Switcher: se construye en js/shell.js -->
      <div id="tenant-switcher" class="tenant-wrap"></div>

      <!-- Navegación agrupada por dominio: se construye en js/shell.js -->
      <nav id="shell-nav" class="shell-nav" aria-label="Módulos"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-user">
          <div class="user-avatar" id="user-avatar" aria-hidden="true">DP</div>
          <div class="sidebar-user-info">
            <span id="user-display-name" class="name">Consultor SST</span>
            <span id="user-display-role" class="role">Doctor Pyme</span>
          </div>
          <button id="btn-logout" class="icon-btn" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </button>
        </div>

        <!-- Solo Super Administrador: ver como y respaldo -->
        <div class="sidebar-actions-grid" role="group" aria-label="Ver como">
          <button type="button" onclick="window.cambiarRol('admin')" class="ghost-btn" title="Ver como administrador">Administrador</button>
          <button type="button" onclick="window.cambiarRol('trabajador')" class="ghost-btn" title="Ver como trabajador">Trabajador</button>
        </div>
        <div class="sidebar-actions-grid" role="group" aria-label="Respaldo">
          <button id="btn-exportar-backup" type="button" class="ghost-btn" title="Descargar respaldo completo (base de datos y archivos)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            Respaldo
          </button>
          <label class="ghost-btn" title="Restaurar desde respaldo (.dpbackup / .json)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            Restaurar
            <input type="file" id="input-importar-backup" accept=".json,.dpbackup" class="hidden">
          </label>
        </div>
      </div>
    </aside>
    <div id="shell-scrim" aria-hidden="true"></div>

    <!-- CONTENIDO PRINCIPAL Y HEADER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden min-w-0">

      <!-- Banner modo demostración -->
      <div id="banner-demo-mode" class="hidden w-full px-4 py-2 text-xs font-semibold flex items-center justify-between z-30 no-print" style="background: var(--warn-bg); color: var(--warn-fg); border-bottom: 1px solid var(--warn-border);">
        <span>Modo demostración: los cambios son de prueba y no se guardan en el servidor.</span>
        <button type="button" onclick="window.salirModoDemo()" class="ghost-btn" style="background: var(--card);">Salir del demo</button>
      </div>

      <header class="shell-header no-print" id="shell-header">
        <div class="flex items-center gap-2 min-w-0">
          <button id="shell-menu-btn" class="icon-btn" type="button" aria-label="Abrir menú de navegación" aria-controls="app-sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <nav class="crumbs" id="shell-crumbs" aria-label="Ruta de navegación"></nav>
        </div>

        <div class="header-right">
          <!-- Selector oculto: fuente de verdad para app.js; el usuario opera el Tenant Switcher -->
          <select id="header-company-select" class="sr-only-shell" tabindex="-1" aria-hidden="true"></select>

          <button id="shell-tenant-chip" type="button" class="ghost-btn md:hidden" style="max-width: 11rem;" aria-label="Cambiar de empresa">
            <span class="tenant-name" id="shell-tenant-chip-name">Empresa</span>
          </button>

          <label class="field-select" title="Vigencia / año">
            <span class="sr-only-shell">Vigencia / año</span>
            <select id="header-year-select" aria-label="Vigencia / año"></select>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </label>

          <button id="header-save-indicator" type="button" class="sync-chip" data-state="ok" onclick="window.mostrarDiagnosticoAlmacenamiento()" title="Centro de resguardo, sincronización y respaldos" aria-live="polite">
            <span id="save-status-dot" class="dot" aria-hidden="true"></span>
            <span id="save-status-text" class="hide-mobile">Sincronizado</span>
            <span id="save-status-badge" class="sr-only-shell"></span>
          </button>
          <button id="btn-forzar-sync" type="button" class="ghost-btn" onclick="window.forzarSincronizacionManual()">Reintentar</button>

          <div class="menu-wrap">
            <button id="shell-actions-btn" class="icon-btn" type="button" aria-label="Más acciones" aria-haspopup="menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
            <div id="shell-actions-menu" class="menu-pop" role="menu">
              <button id="btn-header-nuevo-anio" type="button" class="menu-item" role="menuitem" onclick="window.abrirModalNuevoAnio()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                Nueva vigencia anual
              </button>
              <a href="#empresas" class="menu-item" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/></svg>
                Nueva empresa
              </a>
              <a href="#reportes" class="menu-item" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
                Generar informe PDF
              </a>
              <div class="menu-sep" role="separator"></div>
              <button type="button" class="menu-item" role="menuitem" onclick="window.forzarSincronizacionManual()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                Sincronizar ahora
              </button>
              <button type="button" class="menu-item" role="menuitem" onclick="window.mostrarDiagnosticoAlmacenamiento()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
                Centro de resguardo
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ÁREA DE CONTENIDO DINÁMICO -->
      <main class="shell-main" id="shell-main">
        <div id="main-content" class="shell-content">
          <!-- Renderizado dinámico de vistas -->
        </div>
      </main>
    </div>

    <!-- Navegación inferior móvil (< 768px): se construye en js/shell.js -->
    <nav id="shell-bottom-nav" class="no-print" aria-label="Navegación rápida"></nav>

  </div>

  <!-- SCRIPT PRINCIPAL DE LA APLICACIÓN -->
  <script type="module" src="./js/app.js?v=10.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=3.6').then((reg) => {
          console.log('[PWA] Service Worker registrado en scope:', reg.scope);
          reg.update();
        }).catch((err) => {
          console.warn('[PWA] Error registrando Service Worker:', err);
        });
      });
    }
  </script>
</body>
</html>
