<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEstrategico" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="gradMisional" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradApoyo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#F8FAFC" rx="16"/>

  <!-- Encabezado -->
  <text x="450" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#1E293B">MAPA GENERAL DE PROCESOS (ENFOQUE SG-SST)</text>
  <text x="450" y="62" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">Ciclo PHVA: Planear - Hacer - Verificar - Actuar</text>

  <!-- Requisitos Clientes (Izquierda) -->
  <rect x="25" y="100" width="90" height="360" rx="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <text x="70" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155" transform="rotate(-90 70 240)">NECESIDADES Y REQUISITOS (CLIENTE &amp; SST)</text>

  <!-- Satisfacción Clientes (Derecha) -->
  <rect x="785" y="100" width="90" height="360" rx="12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="830" y="240" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#166534" transform="rotate(90 830 240)">SATISFACCIÓN DEL CLIENTE &amp; SEGURIDAD</text>

  <!-- 1. PROCESOS ESTRATÉGICOS -->
  <rect x="135" y="90" width="630" height="105" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="155" y="112" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#4338CA">PROCESOS ESTRATÉGICOS</text>
  
  <g transform="translate(150, 125)">
    <rect width="180" height="55" rx="8" fill="url(#gradEstrategico)" filter="url(#shadow)"/>
    <text x="90" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Direccionamiento Estratégico</text>
    <text x="90" y="42" font-family="Inter, sans-serif" font-size="9" fill="#E0E7FF" text-anchor="middle">y Liderazgo</text>
  </g>
  <g transform="translate(360, 125)">
    <rect width="180" height="55" rx="8" fill="url(#gradEstrategico)" filter="url(#shadow)"/>
    <text x="90" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gestión Integral de SST</text>
    <text x="90" y="42" font-family="Inter, sans-serif" font-size="9" fill="#E0E7FF" text-anchor="middle">Decreto 1072 &amp; Res. 0312</text>
  </g>
  <g transform="translate(570, 125)">
    <rect width="180" height="55" rx="8" fill="url(#gradEstrategico)" filter="url(#shadow)"/>
    <text x="90" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gestión de Calidad</text>
    <text x="90" y="42" font-family="Inter, sans-serif" font-size="9" fill="#E0E7FF" text-anchor="middle">y Mejora Continua</text>
  </g>

  <!-- 2. PROCESOS MISIONALES / OPERATIVOS -->
  <rect x="135" y="210" width="630" height="130" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="155" y="232" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#047857">PROCESOS MISIONALES / OPERATIVOS (CADENA DE VALOR)</text>

  <g transform="translate(150, 250)">
    <rect width="135" height="70" rx="8" fill="url(#gradMisional)" filter="url(#shadow)"/>
    <text x="67" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gestión Comercial</text>
    <text x="67" y="48" font-family="Inter, sans-serif" font-size="9" fill="#D1FAE5" text-anchor="middle">y Cotizaciones</text>
  </g>
  <!-- Flecha 1 -->
  <path d="M295 285 L310 285" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(320, 250)">
    <rect width="150" height="70" rx="8" fill="url(#gradMisional)" filter="url(#shadow)"/>
    <text x="75" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Operaciones / Obra</text>
    <text x="75" y="48" font-family="Inter, sans-serif" font-size="9" fill="#D1FAE5" text-anchor="middle">Producción &amp; Logística</text>
  </g>
  <!-- Flecha 2 -->
  <path d="M480 285 L495 285" stroke="#059669" stroke-width="3"/>

  <g transform="translate(505, 250)">
    <rect width="125" height="70" rx="8" fill="url(#gradMisional)" filter="url(#shadow)"/>
    <text x="62" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Control de Calidad</text>
    <text x="62" y="48" font-family="Inter, sans-serif" font-size="9" fill="#D1FAE5" text-anchor="middle">&amp; Seguridad en Obra</text>
  </g>
  <!-- Flecha 3 -->
  <path d="M640 285 L655 285" stroke="#059669" stroke-width="3"/>

  <g transform="translate(665, 250)">
    <rect width="90" height="70" rx="8" fill="url(#gradMisional)" filter="url(#shadow)"/>
    <text x="45" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Entrega y</text>
    <text x="45" y="48" font-family="Inter, sans-serif" font-size="9" fill="#D1FAE5" text-anchor="middle">Posventa</text>
  </g>

  <!-- 3. PROCESOS DE APOYO -->
  <rect x="135" y="355" width="630" height="105" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="155" y="377" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#B45309">PROCESOS DE APOYO Y SOPORTE</text>

  <g transform="translate(150, 390)">
    <rect width="135" height="55" rx="8" fill="url(#gradApoyo)" filter="url(#shadow)"/>
    <text x="67" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gestión Humana</text>
    <text x="67" y="42" font-family="Inter, sans-serif" font-size="9" fill="#FEF3C7" text-anchor="middle">Selección &amp; Bienestar</text>
  </g>
  <g transform="translate(305, 390)">
    <rect width="145" height="55" rx="8" fill="url(#gradApoyo)" filter="url(#shadow)"/>
    <text x="72" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Compras y Contratistas</text>
    <text x="72" y="42" font-family="Inter, sans-serif" font-size="9" fill="#FEF3C7" text-anchor="middle">Cadena de Suministros</text>
  </g>
  <g transform="translate(470, 390)">
    <rect width="135" height="55" rx="8" fill="url(#gradApoyo)" filter="url(#shadow)"/>
    <text x="67" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Mantenimiento</text>
    <text x="67" y="42" font-family="Inter, sans-serif" font-size="9" fill="#FEF3C7" text-anchor="middle">Equipos &amp; Herramientas</text>
  </g>
  <g transform="translate(625, 390)">
    <rect width="130" height="55" rx="8" fill="url(#gradApoyo)" filter="url(#shadow)"/>
    <text x="65" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gestión Financiera</text>
    <text x="65" y="42" font-family="Inter, sans-serif" font-size="9" fill="#FEF3C7" text-anchor="middle">y Contabilidad</text>
  </g>
</svg>
